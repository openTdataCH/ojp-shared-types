openapi: 3.0.3
info:
  title: Empty API
  version: 1.0.0
paths: {}
components:
  schemas:
    # Variation of https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__GeneralAttributeStructure
    # OJP1.0 Text - OJP2.0 UserText
    GeneralAttribute:
      type: object
      xml:
        name: Attribute
      required:
        - text
        - code
      properties:
        text:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: Text
        code:
          type: string
          xml:
            name: Code
        hireFacility:
          type: string
          xml:
            name: HireFacility
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        importance:
          type: number
          xml:
            name: Importance

    # Variation of https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__PlaceRefStructure
    # LocationName in OJPv1 , Name in OJPv2
    PlaceRef:
      type: object
      required:
        - locationName
      properties:
        stopPointRef:
          type: string
          xml:
            name: StopPointRef
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        stopPlaceRef:
          type: string
          xml:
            name: StopPlaceRef
        geoPosition:
          $ref: '../../ojp-shared.yml#/components/schemas/GeoPosition'
          xml:
            name: GeoPosition
        locationName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: LocationName

    # Variation of https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__PointOfInterestStructure
    # In OJPv1  - PointOfInterestCode, PointOfInterestName, via Extension in Location
    #    OJPv2  - PublicCode, Name, POIAdditionalInformation
    PointOfInterest:
      type: object
      xml:
        name: PointOfInterest
      required:
        - pointOfInterestCode
        - pointOfInterestName
        - pointOfInterestCategory
      properties:
        pointOfInterestCode:
          type: string
          xml:
            name: PointOfInterestCode
        pointOfInterestName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: PointOfInterestName
        pointOfInterestCategory:
          type: array
          xml:
            name: PointOfInterestCategory
          items:
            $ref: "../../ojp-shared.yml#/components/schemas/PointOfInterestCategoryStructure"
        privateCode:
          type: object
          required:
            - system
            - value
          xml:
            name: PrivateCode
          properties:
            system:
              type: string
              xml:
                name: System
            value:
              type: string
              xml:
                name: Value
        topographicPlaceRef:
          type: string
          xml:
            name: TopographicPlaceRef

    # Variation of OJP2.0 PtSituationElementStructure
    # https://vdvde.github.io/OJP/develop/documentation-tables/siri.html#type_siri__PtSituationElementStructure
    PtSituationElementStructure:
      type: object
      xml:
        name: PtSituationElement
        namespace: "http://www.siri.org.uk/siri"
        prefix: siri
      required:
        - creationTime
        - situationNumber
        - source
        - validityPeriod
        - language
        - summary
        - consequence
        - recommendation
      properties:
        creationTime:
          type: string
          xml:
            name: CreationTime
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        participantRef:
          type: string
          xml:
            name: ParticipantRef
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        situationNumber:
          type: string
          xml:
            name: SituationNumber
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        version:
          type: number
          xml:
            name: Version
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        source:
          type: object
          xml:
            name: Source
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
          required:
            - sourceType
          properties:
            sourceType:
              $ref: "../../ojp-shared.yml#/components/schemas/SituationSourceTypeEnum"
              xml:
                name: SourceType
                namespace: "http://www.siri.org.uk/siri"
                prefix: siri
        validityPeriod:
          type: array
          xml:
            name: ValidityPeriod
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
          items:
            # https://vdvde.github.io/OJP/develop/documentation-tables/siri.html#type_siri__HalfOpenTimestampOutputRangeStructure
            type: object
            xml:
              name: HalfOpenTimestampOutputRangeStructure
              namespace: "http://www.siri.org.uk/siri"
              prefix: siri
            required:
              - startTime
            properties:
              startTime:
                type: string
                xml:
                  name: StartTime
                  namespace: "http://www.siri.org.uk/siri"
                  prefix: siri
              endTime:
                type: string
                xml:
                  name: EndTime
                  namespace: "http://www.siri.org.uk/siri"
                  prefix: siri
        priority:
          type: string
          xml:
            name: Priority
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        scopeType:
          # TODO - make it enum - local-type: typedef-50.4
          type: string
          xml:
            name: ScopeType
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        # https://vdvde.github.io/OJP/develop/documentation-tables/siri.html#type_siri__ActionsStructure
        language:
          type: string
          xml:
            name: Language
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        summary:
          type: string
          xml:
            name: Summary
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        description:
          type: array
          xml:
            name: Description
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
          items:
            type: string
            xml:
              name: Description
              namespace: "http://www.siri.org.uk/siri"
              prefix: siri
        detail:
          type: array
          xml:
            name: Detail
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
          items:
            type: string
            xml:
              name: Detail
              namespace: "http://www.siri.org.uk/siri"
              prefix: siri
        affects:
          type: object
          xml:
            name: Affects
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
          properties:
            stopPoints:
              type: object
              xml:
                name: StopPoints
                namespace: "http://www.siri.org.uk/siri"
                prefix: siri
              properties:
                affectedStopPoint:
                  type: array
                  xml:
                    name: AffectedStopPoint
                    namespace: "http://www.siri.org.uk/siri"
                    prefix: siri
                  items:
                    type: object
                    required:
                      - stopPointRef
                    xml:
                      name: AffectedStopPoint
                      namespace: "http://www.siri.org.uk/siri"
                      prefix: siri
                    properties:
                      stopPointRef:
                        type: string
                        xml:
                          name: StopPointRef
                          namespace: "http://www.siri.org.uk/siri"
                          prefix: siri
            vehicleJourneys:
              type: object
              xml:
                name: VehicleJourneys
                namespace: "http://www.siri.org.uk/siri"
                prefix: siri
              properties:
                affectedVehicleJourney:
                  type: array
                  xml:
                    name: AffectedVehicleJourney
                    namespace: "http://www.siri.org.uk/siri"
                    prefix: siri
                  items:
                    type: object
                    required:
                      - LineRef
                    xml:
                      name: AffectedVehicleJourney
                      namespace: "http://www.siri.org.uk/siri"
                      prefix: siri
                    properties:
                      stopPointRef:
                        type: string
                        xml:
                          name: LineRef
                          namespace: "http://www.siri.org.uk/siri"
                          prefix: siri

    # OJP1 variation of https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__ResponseContextStructure
    ResponseContextStructure:
      type: object
      xml:
        name: ResponseContext
      properties:
        places:
          type: object
          xml:
            name: Places
          required:
            - location
          properties:
            location:
              type: array
              xml:
                name: Location
              items:
                $ref: './ojp-shared.yml#/components/schemas/Location'
        situations:
          type: object
          xml:
            name: Situations
          required:
            - ptSituation
          properties:
            ptSituation:
              type: array
              xml:
                name: PtSituation
              items:
                $ref: '#/components/schemas/PtSituationElementStructure'

    # this doesnt exist in XSD, is created to be re-used accross the other models
    SharedServiceExtension:
      type: object
      xml:
        name: Extension
      properties:
        transportTypeName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: TransportTypeName
        publishedJourneyNumber:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: PublishedJourneyNumber
        operatorName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: OperatorName

    # OJP 2.0 https://vdvde.github.io/OJP/develop/documentation-tables/siri.html#type_siri__RailSubmodesOfTransportEnumeration
    # OJP 1.0 https://laidig.github.io/siri-20-java/doc/schemas/siri_modes-v1_1_xsd/elements/RailSubmode.html
    RailSubmodeEnum:
      type: string 
      enum: [highSpeedRailService, longDistanceTrain, interRegionalRailService, carTransportRailService, sleeperRailService, regionalRail, railShuttle, suburbanRailway, unknown]
      xml:
        name: RailSubmode
        namespace: "http://www.siri.org.uk/siri"
        prefix: siri

    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__ModeStructure
    # adapted for OJP 1.0 - i.e. railSubmode
    ModeStructure:
      type: object
      xml:
        name: Mode
      required:
        - ptMode
      properties:
        ptMode:
          $ref: '../../ojp-shared.yml#/components/schemas/VehicleModesOfTransportEnum'
          xml:
            name: PtMode
        airSubmode:
          type: string
          xml:
            name: AirSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        busSubmode:
          type: string
          xml:
            name: BusSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        coachSubmode:
          type: string
          xml:
            name: CoachSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        funicularSubmode:
          type: string
          xml:
            name: FunicularSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        metroSubmode:
          type: string
          xml:
            name: MetroSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        tramSubmode:
          type: string
          xml:
            name: TramSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        telecabinSubmode:
          type: string
          xml:
            name: TelecabinSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        railSubmode:
          $ref: "#/components/schemas/RailSubmodeEnum"
          xml:
            name: RailSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        waterSubmode:
          type: string
          xml:
            name: WaterSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        name:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: Name
        shortName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: ShortName

    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__ModeFilterStructure
    # adapted for OJP 1.0 - i.e. railSubmode
    ModeFilterStructure:
      type: object
      xml:
        name: ModeFilter
      required:
        - ptMode
        - personalMode
      properties:
        exclude:
          type: boolean
          xml:
            name: Exclude
        ptMode:
          type: array
          xml:
            name: PtMode
          items:
            $ref: '../../ojp-shared.yml#/components/schemas/VehicleModesOfTransportEnum'
        personalMode:
          type: array
          xml:
            name: PersonalMode
          items:
            $ref: '../../ojp-shared.yml#/components/schemas/PersonalModesEnumeration'
        airSubmode:
          type: string
          xml:
            name: AirSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        busSubmode:
          type: string
          xml:
            name: BusSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        coachSubmode:
          type: string
          xml:
            name: CoachSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        funicularSubmode:
          type: string
          xml:
            name: FunicularSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        metroSubmode:
          type: string
          xml:
            name: MetroSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        tramSubmode:
          type: string
          xml:
            name: TramSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        telecabinSubmode:
          type: string
          xml:
            name: telecabinSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        railSubmode:
          $ref: "#/components/schemas/RailSubmodeEnum"
          xml:
            name: RailSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        waterSubmode:
          type: string
          xml:
            name: WaterSubmode
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri

    # modified from 'openapi/ojp-shared.yml#/components/schemas/DatedJourney'
    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__DatedJourneyStructure
    DatedJourney:
      type: object
      xml:
        name: Service
      required:
        - operatingDayRef
        - journeyRef
        - lineRef
        - mode
        - attribute
        - publishedLineName
      properties:
        conventionalModeOfOperation:
          type: string
          xml:
            name: ConventionalModeOfOperation
        operatingDayRef:
          type: string
          xml:
            name: OperatingDayRef
        journeyRef:
          type: string
          xml:
            name: JourneyRef
        publicCode:
          type: string
          xml:
            name: PublicCode
        lineRef:
          type: string
          xml:
            name: LineRef
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        directionRef:
          type: string
          xml:
            name: DirectionRef
            namespace: "http://www.siri.org.uk/siri"
            prefix: siri
        mode:
          $ref: '#/components/schemas/ModeStructure'
          xml:
            name: Mode
        productCategory:
          $ref: '../../ojp-shared.yml#/components/schemas/ProductCategory'
          xml:
            name: ProductCategory
        publishedLineName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: PublishedLineName
        trainNumber:
          type: string
          xml:
            name: TrainNumber
        attribute:
          type: array
          xml:
            name: Attribute
          items:
            $ref: '#/components/schemas/GeneralAttribute'
        operatorRef:
          type: string
          xml:
            name: OperatorRef
        destinationStopPointRef:
          type: string
          xml:
            name: DestinationStopPointRef
        destinationText:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: 
        unplanned:
          type: boolean
          xml:
            name: Unplanned
        cancelled:
          type: boolean
          xml:
            name: Cancelled
        deviation:
          type: boolean
          xml:
            name: Deviation
        # compared with OJPv2 we have the array at the top-level, no <SituationFullRefs> wrapper
        situationFullRef:
          type: array
          xml:
            name: SituationFullRef
          items:
            $ref: "../../ojp-shared.yml#/components/schemas/SituationFullRefStructure"

    # DatedJourney

    # Variation of Place
    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__PlaceStructure
    Location:
      type: object
      xml:
        name: Location
      required:
        - locationName
        - geoPosition
        - mode
        - attribute
      properties:
        stopPoint:
          $ref: '../../ojp-shared.yml#/components/schemas/StopPoint'
          xml:
            name: StopPoint
        stopPlace:
          $ref: '../../ojp-shared.yml#/components/schemas/StopPlace'
          xml:
            name: StopPlace
        topographicPlace:
          $ref: '../../ojp-shared.yml#/components/schemas/TopographicPlace'
          xml:
            name: TopographicPlace
        pointOfInterest:
          $ref: '#/components/schemas/PointOfInterest'
          xml:
            name: PointOfInterest
        address:
          $ref: '../../ojp-shared.yml#/components/schemas/Address'
          xml:
            name: Address
        locationName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: LocationName
        geoPosition:
          $ref: '../../ojp-shared.yml#/components/schemas/GeoPosition'
          xml:
            name: GeoPosition
        mode:
          type: array
          xml:
            name: Mode
          items:
            $ref: '#/components/schemas/ModeStructure'
        attribute:
          type: array
          xml:
            name: Attribute
          items:
            $ref: '#/components/schemas/GeneralAttribute'
        extension:
          type: object
          xml:
            name: Extension
          properties:
            locationExtensionStructure:
              type: object
              xml:
                name: LocationExtensionStructure
              additionalProperties:
                type: string
    # Location

    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__LegBoardStructure
    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__CallAtStopStructure
    # Variation fpr OJPv1 - contains SiriSituationFullRef (in OJP v2 is under Service)
    CallAtStop:
      type: object
      xml:
        name: CallAtStop
      required:
        - stopPointRef
        - stopPointName
      properties:
        stopPointRef:
          type: string
          xml:
            name: StopPointRef
        stopPointName:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: StopPointName
        nameSuffix:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: NameSuffix
        plannedQuay:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: PlannedQuay
        estimatedQuay:
          $ref: '../../ojp-shared.yml#/components/schemas/InternationalText'
          xml:
            name: EstimatedQuay
        serviceArrival:
          $ref: '../../ojp-shared.yml#/components/schemas/SharedServiceArrivalDeparture'
          xml:
            name: ServiceArrival
        serviceDeparture:
          $ref: '../../ojp-shared.yml#/components/schemas/SharedServiceArrivalDeparture'
          xml:
            name: ServiceDeparture
        order:
          type: number
          xml:
            name: Order
        requestStop:
          type: boolean
          xml:
            name: RequestStop
        unplannedStop:
          type: boolean
          xml:
            name: UnplannedStop
        notServicedStop:
          type: boolean
          xml:
            name: NotServicedStop
        noBoardingAtStop:
          type: boolean
          xml:
            name: NoBoardingAtStop
        noAlightingAtStop:
          type: boolean
          xml:
            name: NoAlightingAtStop
        expectedDepartureOccupancy:
          type: array
          xml:
            name: ExpectedDepartureOccupancy
          items:
            $ref: "../../ojp-shared.yml#/components/schemas/ExpectedDepartureOccupancyStructure"

    # SharedLegSection

    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__CallAtNearStopStructure
    CallAtNearStop:
      type: object
      xml:
        name: CallAtNearStop
      required:
        - callAtStop
      properties:
        callAtStop:
          $ref: '#/components/schemas/CallAtStop'
          xml:
            name: CallAtStop

    # OJP v1.0 version of https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__IndividualTransportOptionStructure
    IndividualTransportOptionsStructure:
      type: object
      required:
        - mode
      xml:
        name: IndividualTransportOptions
      properties:
        mode:
          type: string
          xml:
            name: Mode
        maxDistance:
          type: number
          xml:
            name: MaxDistance
        maxDuration:
          type: string
          xml:
            name: MaxDuration
        minDistance:
          type: number
          xml:
            name: MinDistance
        minDuration:
          type: string
          xml:
            name: MinDuration

    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__PlaceContextStructure
    PlaceContext:
      type: object
      xml:
        name: OJPStopEventRequest
      required:
        - placeRef
      properties:
        placeRef:
          $ref: './ojp-shared.yml#/components/schemas/PlaceRef'
          xml:
            name: PlaceRef
        depArrTime:
          type: string
          xml:
            name: DepArrTime
        individualTransportOptions:
          type: array
          xml:
            name: IndividualTransportOptions
          items:
            $ref: "#/components/schemas/IndividualTransportOptionsStructure"

    # OJP v1
    # https://vdvde.github.io/OJP/develop/documentation-tables/ojp.html#type_ojp__TrackSectionStructure
    TrackSectionStructure:
      type: object
      xml:
        name: TrackSection
      properties:
        trackStart:
          $ref: '#/components/schemas/PlaceRef'
          xml:
            name: TrackStart
        trackEnd:
          $ref: '#/components/schemas/PlaceRef'
          xml:
            name: TrackEnd
        linkProjection:
          $ref: '../../ojp-shared.yml#/components/schemas/LinkProjection'
          xml:
            name: LinkProjection
        roadName:
          type: string
          xml:
            name: RoadName
        duration:
          type: string
          xml:
            name: Duration
        length:
          type: number
          xml:
            name: Length
